<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יפן של שמחה ובני</title>
<meta name="description" content="המסע של שמחה ובני ביפן, יום אחרי יום: איפה אנחנו, לאן נוסעים, מזג אוויר וטיפים.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9ECFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="יפן">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css?v=20">
</head>
<body>

<!-- Content layer -->
<main class="app" id="app">

  <!-- ===== Today ===== -->
  <section class="screen" id="screen-today" data-screen="today">
    <header class="top">
      <div class="top__row">
        <h1 class="largetitle" id="todayTitle">היום</h1>
        <div class="stepper" role="group" aria-label="מעבר בין ימים">
          <button class="stepper__btn" id="dayPrev" aria-label="היום הקודם">
            <svg class="chev chev--back" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="stepper__btn" id="dayNext" aria-label="היום הבא">
            <svg class="chev chev--fwd" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <button class="pill pill--accent" id="btnBackToday" hidden>חזרה להיום</button>
    </header>

    <article class="hero" id="hero" aria-live="polite"></article>

    <section class="card route" id="route" aria-label="הנסיעה של היום"></section>

    <section class="card weather" id="weather" aria-label="מזג האוויר"></section>
    <section class="card mission" id="mission" aria-label="משימה"></section>


    <section class="section" id="timelineWrap">
      <h2 class="title2" id="timelineTitle">המסלול היום</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="card airport" id="airport" aria-label="איך מגיעים לשדה התעופה"></section>

    <section class="section" id="miniMapWrap">
      <h2 class="title2">איפה זה</h2>
      <div class="minimap">
        <div class="minimap__map" id="miniMap" role="region" aria-label="מפת היום"></div>
        <button class="minimap__label" id="miniMapBtn">למפה המלאה</button>
      </div>
    </section>

    <section class="section" id="dayTipsWrap">
      <h2 class="title2">על הדרך</h2>
      <ul class="rows" id="dayTips"></ul>
    </section>

    <p class="foot" id="daySource"></p>
  </section>

  <!-- ===== Journey ===== -->
  <section class="screen" id="screen-journey" data-screen="journey" hidden>
    <header class="top"><h1 class="largetitle">המסע</h1></header>
    <p class="lead" id="journeyLead"></p>
    <figure class="routemap card" id="routeMap" aria-label="מפת המסלול ביפן"></figure>
    <div class="cities" id="cities"></div>
    <section class="section" id="journeyList"></section>
    <p class="foot" id="credits"></p>
  </section>

  <!-- ===== Map ===== -->
  <section class="screen screen--map" id="screen-map" data-screen="map" hidden>
    <header class="top top--overlay">
      <h1 class="largetitle">מפה</h1>
    </header>
    <div class="chips" id="mapChips" role="tablist" aria-label="סינון לפי יום"></div>
    <div class="bigmap" id="bigMap" role="region" aria-label="מפה אינטראקטיבית"></div>
    <button class="glass glass--circle locate" id="btnLocate" aria-label="איפה אני">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
    </button>
  </section>

  <!-- ===== Tips ===== -->
  <section class="screen" id="screen-tips" data-screen="tips" hidden>
    <header class="top"><h1 class="largetitle">טיפים</h1></header>
    <div class="segments" id="tipSegments" role="tablist"></div>
    <div id="tipsBody"></div>
  </section>

</main>

<!-- Control layer: floating tab bar -->
<nav class="tabbar" aria-label="ניווט ראשי">
  <div class="tabbar__edge" aria-hidden="true"></div>
  <div class="glass tabbar__bar" id="tabbar">
    <button class="tab is-active" data-go="today" aria-current="page">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>היום</span>
    </button>
    <button class="tab" data-go="journey">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 18c4-1 3-7 7-8s3 6 7-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="18" r="2" fill="currentColor"/><circle cx="19" cy="8" r="2" fill="currentColor"/></svg>
      <span>המסע</span>
    </button>
    <button class="tab" data-go="map">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 21s6-6 6-11a6 6 0 0 0-12 0c0 5 6 11 6 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></svg>
      <span>מפה</span>
    </button>
    <button class="tab" data-go="tips">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1.1 1 1.9h5c.1-.8.4-1.4 1-1.9A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>טיפים</span>
    </button>
  </div>
</nav>

<!-- Place card sheet (map pin) -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheetPlace" hidden role="dialog" aria-modal="true" aria-labelledby="placeTitle">
  <div class="sheet__grab" aria-hidden="true"></div>
  <div class="sheet__bar">
    <span></span>
    <h2 id="placeTitle" class="sr-only">מקום</h2>
    <button class="textbtn textbtn--strong" data-close>סגירה</button>
  </div>
  <div class="sheet__body" id="placeBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet.js"></script>
<script src="app.js?v=20"></script>
</body>
</html>
